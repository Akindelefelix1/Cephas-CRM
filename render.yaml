services:
  - type: web
    name: cephas-crm-ui
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cephas-crm-api.onrender.com
      - key: VITE_NEON_AUTH_URL
        value: https://ep-solitary-rain-bdzyf7z9.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
